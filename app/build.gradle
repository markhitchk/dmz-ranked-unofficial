plugins {
    id 'com.android.application'
}

def generatedLogoResDir = file("$buildDir/generated/dmzLogoRes")
def generatedStudioLogoResDir = file("$buildDir/generated/studioBrandRes")
def generatedHubAssetsDir = file("$buildDir/generated/rankedHubAssets")
def studioLogoUrl = "https://raw.githubusercontent.com/markhitchk/Puppy-Clicker/main/assets/logos/harleys_studios.png"
def canonicalStudioLogoGitSha = "411164454ee72e94869cc7b0141644478a0b77d4"

tasks.register("bundleOfficialStudioLogo") {
    outputs.dir(generatedStudioLogoResDir)

    doLast {
        def outputDir = new File(generatedStudioLogoResDir, "drawable-nodpi")
        def outputFile = new File(outputDir, "harleys_studios_official.png")
        if (!outputFile.exists() || outputFile.length() == 0) {
            def connection = new URL(studioLogoUrl).openConnection()
            connection.setConnectTimeout(15000)
            connection.setReadTimeout(20000)
            def bytes = connection.getInputStream().withCloseable { input -> input.bytes }
            outputDir.mkdirs()
            outputFile.bytes = bytes
        }

        // Exact source artwork from Puppy Clicker, not an AI-generated stand-in.
        def bytes = outputFile.bytes
        if (bytes.length != 1556980 || bytes.length < 8 ||
                bytes[0] != (byte)0x89 || bytes[1] != (byte)0x50 ||
                bytes[2] != (byte)0x4E || bytes[3] != (byte)0x47) {
            throw new GradleException("Harley's Studios source is missing or not the verified PNG")
        }
        def md = java.security.MessageDigest.getInstance("SHA-1")
        md.update(("blob " + bytes.length).getBytes("UTF-8"))
        md.update((byte) 0)
        md.update(bytes)
        def actualSha = md.digest().collect { String.format("%02x", it & 0xFF) }.join("")
        if (actualSha != canonicalStudioLogoGitSha) {
            throw new GradleException("Harley's Studios logo checksum differs from canonical Puppy Clicker asset")
        }
        println("Bundled official Harley's Studios logo from Puppy Clicker: " + actualSha)
    }
}

def sourceLogoFile = file("src/main/logo/png/dmz_ranked_logo.png")
def generatedAppUiAssetsDir = file("$buildDir/generated/dmzAppUiAssets")
def sourceRemoteAppUiDir = file("../remote/app-ui")

tasks.register("generateDmzRemoteUiFallback") {
    inputs.files(
            new File(sourceRemoteAppUiDir, "app.css"),
            new File(sourceRemoteAppUiDir, "app.js")
    )
    outputs.dir(generatedAppUiAssetsDir)

    doLast {
        def cssSource = new File(sourceRemoteAppUiDir, "app.css")
        def jsSource = new File(sourceRemoteAppUiDir, "app.js")
        if (!cssSource.exists() || !jsSource.exists()) {
            throw new GradleException("Missing canonical remote/app-ui fallback sources")
        }

        def outputDir = new File(generatedAppUiAssetsDir, "dmz-app-ui")
        outputDir.mkdirs()
        copy {
            from(sourceRemoteAppUiDir)
            include("app.css", "app.js")
            into(outputDir)
        }
        println("Generated bundled DMZ app UI fallback from remote/app-ui")
    }
}


tasks.register("generateDmzLogo") {
    inputs.file(sourceLogoFile)
    outputs.dir(generatedLogoResDir)

    doLast {
        if (!sourceLogoFile.exists()) {
            throw new GradleException("Missing DMZ logo PNG: " + sourceLogoFile)
        }

        def sourceBytes = sourceLogoFile.bytes
        if (sourceBytes.length < 8 ||
                sourceBytes[0] != (byte)0x89 ||
                sourceBytes[1] != (byte)0x50 ||
                sourceBytes[2] != (byte)0x4E ||
                sourceBytes[3] != (byte)0x47) {
            throw new GradleException("Decoded DMZ logo is not a valid PNG")
        }

        // Normalize the logo to a real PNG with an alpha channel. The source is
        // intentionally compact/paletted; ImageIO expands it and we snap the
        // near-transparent background to fully transparent so Android never
        // renders a black square around the logo.
        System.setProperty("java.awt.headless", "true")
        def sourceImage = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(sourceBytes))
        if (sourceImage == null) {
            throw new GradleException("Could not decode DMZ logo PNG")
        }

        def transparentImage = new java.awt.image.BufferedImage(
                sourceImage.getWidth(),
                sourceImage.getHeight(),
                java.awt.image.BufferedImage.TYPE_INT_ARGB
        )

        for (int y = 0; y < sourceImage.getHeight(); y++) {
            for (int x = 0; x < sourceImage.getWidth(); x++) {
                int argb = sourceImage.getRGB(x, y)
                int alpha = (argb >>> 24) & 0xFF
                int normalizedAlpha = alpha < 8 ? 0 : (alpha > 247 ? 255 : alpha)
                transparentImage.setRGB(x, y, (normalizedAlpha << 24) | (argb & 0x00FFFFFF))
            }
        }

        def outputDir = new File(generatedLogoResDir, "drawable-nodpi")
        outputDir.mkdirs()

        def outputFile = new File(outputDir, "dmz_ranked_logo.png")
        if (!javax.imageio.ImageIO.write(transparentImage, "png", outputFile)) {
            throw new GradleException("Could not write transparent DMZ logo PNG")
        }

        println("Generated transparent PNG logo: " + outputFile + " (" + outputFile.length() + " bytes)")

        // Adaptive icons need a padded foreground so Android's launcher mask does
        // not shrink the DMZ artwork into a tiny legacy-icon tile.
        def launcherSize = 512
        def launcherArtSize = 360
        def launcherForeground = new java.awt.image.BufferedImage(
                launcherSize,
                launcherSize,
                java.awt.image.BufferedImage.TYPE_INT_ARGB
        )
        def foregroundGraphics = launcherForeground.createGraphics()
        foregroundGraphics.setRenderingHint(
                java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC
        )
        foregroundGraphics.setRenderingHint(
                java.awt.RenderingHints.KEY_ANTIALIASING,
                java.awt.RenderingHints.VALUE_ANTIALIAS_ON
        )

        double logoScale = Math.min(
                launcherArtSize / (double) transparentImage.getWidth(),
                launcherArtSize / (double) transparentImage.getHeight()
        )
        int logoWidth = Math.max(1, (int) Math.round(transparentImage.getWidth() * logoScale))
        int logoHeight = Math.max(1, (int) Math.round(transparentImage.getHeight() * logoScale))
        int logoX = (launcherSize - logoWidth).intdiv(2)
        int logoY = (launcherSize - logoHeight).intdiv(2)
        foregroundGraphics.drawImage(transparentImage, logoX, logoY, logoWidth, logoHeight, null)
        foregroundGraphics.dispose()

        def foregroundFile = new File(outputDir, "dmz_launcher_foreground.png")
        if (!javax.imageio.ImageIO.write(launcherForeground, "png", foregroundFile)) {
            throw new GradleException("Could not write adaptive launcher foreground")
        }

        // Base mipmap fallback. API 26+ uses the adaptive icon XML override.
        def legacyDir = new File(generatedLogoResDir, "mipmap-nodpi")
        legacyDir.mkdirs()
        def legacyIcon = new java.awt.image.BufferedImage(
                launcherSize,
                launcherSize,
                java.awt.image.BufferedImage.TYPE_INT_ARGB
        )
        def legacyGraphics = legacyIcon.createGraphics()
        legacyGraphics.setColor(new java.awt.Color(17, 17, 17, 255))
        legacyGraphics.fillRect(0, 0, launcherSize, launcherSize)
        legacyGraphics.setRenderingHint(
                java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC
        )

        int legacyArtSize = 420
        double legacyScale = Math.min(
                legacyArtSize / (double) transparentImage.getWidth(),
                legacyArtSize / (double) transparentImage.getHeight()
        )
        int legacyWidth = Math.max(1, (int) Math.round(transparentImage.getWidth() * legacyScale))
        int legacyHeight = Math.max(1, (int) Math.round(transparentImage.getHeight() * legacyScale))
        int legacyX = (launcherSize - legacyWidth).intdiv(2)
        int legacyY = (launcherSize - legacyHeight).intdiv(2)
        legacyGraphics.drawImage(
                transparentImage,
                legacyX,
                legacyY,
                legacyWidth,
                legacyHeight,
                null
        )
        legacyGraphics.dispose()

        def legacyIconFile = new File(legacyDir, "ic_launcher.png")
        def legacyRoundFile = new File(legacyDir, "ic_launcher_round.png")
        if (!javax.imageio.ImageIO.write(legacyIcon, "png", legacyIconFile) ||
                !javax.imageio.ImageIO.write(legacyIcon, "png", legacyRoundFile)) {
            throw new GradleException("Could not write launcher icon fallbacks")
        }

        // Dedicated Android 12+ splash icon. Android applies its own icon
        // bounds, so use a larger transparent canvas with centered artwork.
        def splashCanvasSize = 512
        def splashArtSize = 260
        def splashIcon = new java.awt.image.BufferedImage(
                splashCanvasSize,
                splashCanvasSize,
                java.awt.image.BufferedImage.TYPE_INT_ARGB
        )
        def splashGraphics = splashIcon.createGraphics()
        splashGraphics.setRenderingHint(
                java.awt.RenderingHints.KEY_INTERPOLATION,
                java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC
        )
        splashGraphics.setRenderingHint(
                java.awt.RenderingHints.KEY_ANTIALIASING,
                java.awt.RenderingHints.VALUE_ANTIALIAS_ON
        )

        double splashScale = Math.min(
                splashArtSize / (double) transparentImage.getWidth(),
                splashArtSize / (double) transparentImage.getHeight()
        )
        int splashWidth = Math.max(1, (int) Math.round(transparentImage.getWidth() * splashScale))
        int splashHeight = Math.max(1, (int) Math.round(transparentImage.getHeight() * splashScale))
        int splashX = (splashCanvasSize - splashWidth).intdiv(2)
        int splashY = (splashCanvasSize - splashHeight).intdiv(2)
        splashGraphics.drawImage(transparentImage, splashX, splashY, splashWidth, splashHeight, null)
        splashGraphics.dispose()

        def splashFile = new File(outputDir, "dmz_splash_icon.png")
        if (!javax.imageio.ImageIO.write(splashIcon, "png", splashFile)) {
            throw new GradleException("Could not write Android splash icon")
        }

        println("Generated Android splash icon: " + splashFile + " (" + splashFile.length() + " bytes)")

        println("Generated adaptive and fallback launcher artwork")
    }
}

tasks.register("prepareRankedHubAssets") {
    dependsOn("bundleOfficialStudioLogo")
    inputs.file(sourceLogoFile)
    outputs.dir(generatedHubAssetsDir)
    doLast {
        def target = new File(generatedHubAssetsDir, "ranked-hub")
        target.mkdirs()
        def officialLogo = new File(generatedStudioLogoResDir, "drawable-nodpi/harleys_studios_official.png")
        if (!officialLogo.exists() || officialLogo.length() != 1556980) {
            throw new GradleException("Missing verified official Harley's Studios artwork")
        }
        copy {
            from officialLogo
            into target
            rename { "official_studio.png" }
        }
        copy {
            from sourceLogoFile
            into target
            rename { "dmz_community.png" }
        }
        // Bundle Puppy Clicker's exact official website logo for the Projects launcher.
        def puppyLogoUrl = "https://raw.githubusercontent.com/markhitchk/Puppy-Clicker/main/assets/logos/puppy_clicker.png"
        def puppyLogoSha = "120206a7057633b3da2c49ba70c001926c19860c"
        def puppyLogoFile = new File(target, "puppy_clicker.png")
        if (!puppyLogoFile.exists() || puppyLogoFile.length() != 920318) {
            def connection = new URL(puppyLogoUrl).openConnection()
            connection.setConnectTimeout(20000)
            connection.setReadTimeout(30000)
            puppyLogoFile.bytes = connection.getInputStream().withCloseable { it.bytes }
        }
        def puppyBytes = puppyLogoFile.bytes
        if (puppyBytes.length != 920318
                || puppyBytes[0] != (byte)0x89 || puppyBytes[1] != (byte)0x50) {
            throw new GradleException("Missing official Puppy Clicker PNG artwork")
        }
        def puppyDigest = java.security.MessageDigest.getInstance("SHA-1")
        puppyDigest.update(("blob " + puppyBytes.length).getBytes("UTF-8"))
        puppyDigest.update((byte)0)
        puppyDigest.update(puppyBytes)
        def puppyActualSha = puppyDigest.digest()
                .collect { String.format("%02x", it & 0xFF) }.join("")
        if (puppyActualSha != puppyLogoSha) {
            throw new GradleException("Puppy Clicker artwork does not match canonical repo asset")
        }

        // Bundle the owner-selected MW4 Discord server icon for offline UI.
        def discordLogoUrl = "https://cdn.discordapp.com/icons/1560773091674685563/add804ea564a54751612a45d8a5aeb1c.webp?size=512"
        def discordLogoFile = new File(target, "dmz-v1-discord.webp")
        if (!discordLogoFile.exists() || discordLogoFile.length() < 1024) {
            def response = null
            def lastError = null
            for (int attempt = 1; attempt <= 3; attempt++) {
                try {
                    def connection = (java.net.HttpURLConnection) new URL(discordLogoUrl).openConnection()
                    connection.setConnectTimeout(20000)
                    connection.setReadTimeout(25000)
                    connection.setInstanceFollowRedirects(true)
                    connection.setRequestProperty("User-Agent", "Mozilla/5.0 (RankedHub-Android/1.0; IconFetch)")
                    connection.setRequestProperty("Accept", "image/webp,image/*;q=0.9,*/*;q=0.1")
                    if (connection.responseCode != 200) {
                        throw new GradleException("Discord image returned HTTP " + connection.responseCode)
                    }
                    response = connection.inputStream.withCloseable { it.bytes }
                    connection.disconnect()
                    break
                } catch (Exception error) {
                    lastError = error
                    if (attempt < 3) Thread.sleep(700L * attempt)
                }
            }
            if (response == null) {
                throw new GradleException("Cannot bundle selected MW4 Discord icon", lastError)
            }
            discordLogoFile.bytes = response
        }
        def iconBytes = discordLogoFile.bytes
        def riff = new String(iconBytes, 0, Math.min(iconBytes.length, 4), "US-ASCII")
        def webp = iconBytes.length >= 12 ? new String(iconBytes, 8, 4, "US-ASCII") : ""
        if (iconBytes.length < 1024 || riff != "RIFF" || webp != "WEBP") {
            throw new GradleException("Selected MW4 logo is not valid WEBP")
        }
        println("Bundled DMZ MW4 Discord icon (" + iconBytes.length + " bytes)")

        if (!new File(target, "dmz_community.png").exists()) {
            throw new GradleException("Missing legacy DMZ Ranked artwork")
        }
    }
}

android {
    namespace 'com.harleytg.dmzranked'
    compileSdk 36

    defaultConfig {
        applicationId 'com.harleytg.dmzranked'
        minSdk 26
        targetSdk 36
        versionCode 186
        versionName '1.0.82'
    }

    sourceSets {
        main {
            res.srcDir generatedLogoResDir
            res.srcDir generatedStudioLogoResDir
            assets.srcDir generatedAppUiAssetsDir
            assets.srcDir generatedHubAssetsDir
        }
    }

    signingConfigs {
        release {
            def stableKeystore = System.getenv("DMZ_RELEASE_KEYSTORE")
                    ?: "${System.properties['user.home']}/.android/debug.keystore"
            storeFile file(stableKeystore)
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        beta {
            initWith debug
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
            signingConfig signingConfigs.release
            // Signed public Beta; avoid shipping a debuggable credential-bearing WebView.
            debuggable false
            matchingFallbacks = ['debug']
            resValue 'string', 'app_name', 'Ranked Hub [Beta]'
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("generateDmzLogo")
    dependsOn("bundleOfficialStudioLogo")
    dependsOn("generateDmzRemoteUiFallback")
    dependsOn("prepareRankedHubAssets")
}


dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'androidx.work:work-runtime:2.10.1'
}

 
// Keep the existing production/debug DMZRanked app IDs unchanged.
// Ranked Hub Beta is a separately installable app, not an update-in-place.
androidComponents {
    onVariants(selector().withBuildType('beta')) { variant ->
        variant.applicationId.set('com.harleytg.rankedhub.beta')
    }
}
