name: React Native Beta Verify and APK

on:
  push:
    branches: [ react-native-migration ]
  pull_request:
    branches: [ react-native-migration ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: beta
      CI: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Expo doctor
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build beta APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/zipalign" -c -v 4 "$APK"

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: DMZ-Ranked-React-Native-Beta-1.1.0-183-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
