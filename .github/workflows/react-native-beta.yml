name: React Native Beta Verify and APK

on:
  push:
    branches: [ react-native-migration ]
  pull_request:
    branches: [ react-native-migration ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    env:
      APP_VARIANT: beta
      CI: '1'
      # Npm stable-only peer ranges often exclude React Native release candidates.
      # Preview branch only: native-build and Expo compatibility checks remain mandatory.
      NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No lockfile yet. Merge the automated dependency-refresh PR for reproducible builds."
            npm install --no-audit --no-fund
          fi

      - name: Align Expo SDK 58 preview and verify compatibility
        run: |
          npx expo install --fix --npm
          npx expo install --check
          npx expo-doctor

      - name: Report available dependency upgrades
        run: npm outdated || true

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Expo doctor
        run: npx expo-doctor

      - name: Verify beta package and resolve APK filename
        run: |
          set -euo pipefail
          npx expo config --json --type public | node -e '
            const fs = require("node:fs");
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const cfg = JSON.parse(data);
              if (cfg.android?.package !== "com.harleytg.dmzranked.beta" || cfg.extra?.appChannel !== "beta")
                throw Error("Beta package/channel mismatch");
              const code = cfg.android?.versionCode;
              if (!/^[0-9]+(?:\.[0-9]+){2,3}$/.test(String(cfg.version)) || !Number.isInteger(code) || code < 1)
                throw Error("Invalid beta version/build");
              const stem = "DMZ-Ranked-React-Native-Beta-" + cfg.version + "-" + code;
              fs.appendFileSync(process.env.GITHUB_ENV, "BETA_APK_STEM=" + stem + "\n");
              console.log("Verified beta artifact: " + stem);
            });
          '

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build beta APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/zipalign" -c -v 4 "$APK"

      - name: Upload beta APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BETA_APK_STEM }}-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
