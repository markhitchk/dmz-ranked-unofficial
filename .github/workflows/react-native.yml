name: React Native migration

on:
  push:
    branches: [react-native-migration]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
      - name: Install
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Loading regression tests
        run: npm test
      - name: Expo doctor
        run: npm run doctor
      - name: Bundle Android and iOS JavaScript
        run: npx expo export --platform all --output-dir dist
