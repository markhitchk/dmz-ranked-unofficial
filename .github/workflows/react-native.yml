name: React Native migration

on:
  push:
    branches: [react-native-migration]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      CI: '1'
      NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No lockfile yet. Merge the automated dependency-refresh PR for reproducible builds."
            npm install --no-audit --no-fund
          fi
      - name: Align Expo native packages
        run: npx expo install --fix --npm

      - name: Verify latest Expo-compatible dependencies
        run: |
          npx expo install --check
          npx expo-doctor

      - name: Report available dependency upgrades
        run: npm outdated || true

      - name: TypeScript
        run: npm run typecheck
      - name: Loading regression tests
        run: npm test
      - name: Expo doctor
        run: npm run doctor
      - name: Bundle Android and iOS JavaScript
        run: npx expo export --platform all --output-dir dist
