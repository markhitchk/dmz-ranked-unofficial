name: React Native migration

on:
  push:
    branches: [react-native-migration]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Expo doctor
        run: npm run doctor
      - name: Bundle Android and iOS JavaScript
        run: npx expo export --platform all --output-dir dist
