name: Sign stable React Native AAB with existing upload key

on:
  push:
    branches: [react-native-migration]
    paths:
      - '.github/workflows/sign-react-native-stable-aab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign-stable-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out React Native branch
        uses: actions/checkout@v4

      - name: Check out existing Java signing material
        uses: actions/checkout@v4
        with:
          ref: main
          path: .java-signing-source
          sparse-checkout: signing
          persist-credentials: false

      - name: Get previously verified stable AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37754819996             --repo "$GITHUB_REPOSITORY"             --name "DMZ-Ranked-React-Native-Stable-1.1.0-177-Unsigned-AAB"             --dir unsigned

      - name: Verify existing key matches Google Play upload certificate
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/dmz-existing-upload-key.jks"
          base64 --decode .java-signing-source/signing/dmz-ranked-update.jks.b64 > "$KEY"
          chmod 600 "$KEY"
          KEY_SHA1="$(keytool -list -v -keystore "$KEY"             -storepass android -alias androiddebugkey |
            sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          EXPECTED_SHA1="E2:A5:91:C6:B8:2E:FE:1F:5E:67:17:0D:A4:AE:68:1E:D0:9F:BE:E5"
          echo "Existing keystore SHA-1: $KEY_SHA1"
          if [ "$KEY_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Existing keystore DOES NOT match the previously recorded Google Play upload certificate. Refusing to sign with the wrong key."
            exit 1
          fi
          echo "Existing keystore matches the recorded Play upload certificate."
          echo "DMZ_KEYSTORE=$KEY" >> "$GITHUB_ENV"

      - name: Sign production React Native bundle
        run: |
          set -euo pipefail
          ORIGINAL="unsigned/DMZ-Ranked-React-Native-Stable-1.1.0-177.aab"
          SIGNED="DMZ-Ranked-React-Native-Stable-1.1.0-177-Signed.aab"
          test -s "$ORIGINAL"
          jarsigner             -keystore "$DMZ_KEYSTORE" -storepass android -keypass android             -signedjar "$SIGNED" "$ORIGINAL" androiddebugkey
          jarsigner -verify "$SIGNED"
          SIGNED_SHA1="$(keytool -printcert -jarfile "$SIGNED"             | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          EXPECTED_SHA1="E2:A5:91:C6:B8:2E:FE:1F:5E:67:17:0D:A4:AE:68:1E:D0:9F:BE:E5"
          if [ "$SIGNED_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signed bundle has an unexpected certificate."
            exit 1
          fi
          unzip -t "$SIGNED" | tail -1
          rm -f "$DMZ_KEYSTORE"
          echo "Successfully signed stable AAB with the expected upload certificate."

      - name: Upload signed stable Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: DMZ-Ranked-React-Native-Stable-1.1.0-177-Signed-AAB
          path: DMZ-Ranked-React-Native-Stable-1.1.0-177-Signed.aab
          if-no-files-found: error
          retention-days: 30
