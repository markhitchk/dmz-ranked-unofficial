name: Sign stable React Native AAB with verified Play upload key

# Manual fallback for signing a historical unsigned 1.1.1 (187) bundle.
# The main stable AAB workflow already attempts upload-key signing.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  sign-stable-aab:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore original stable Google Play upload key from main CI cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.android/debug.keystore
          key: dmz-ranked-apk-signing-v1
          fail-on-cache-miss: true

      - name: Download tested, unsigned React Native stable bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME=DMZ-Ranked-React-Native-Stable-1.1.1-187-Unsigned-AAB
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.name == "DMZ-Ranked-React-Native-Stable-1.1.1-187-Unsigned-AAB" and .expired == false)) | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo '::error::No unsigned 1.1.1 (187) AAB artifact is available to sign.'
            exit 1
          fi
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir unsigned

      - name: Verify original upload signing certificate before signing
        run: |
          set -euo pipefail
          KEY="$HOME/.android/debug.keystore"
          test -s "$KEY" || { echo "::error::Original signing key was not restored"; exit 1; }
          EXPECTED_SHA1="E2:A5:91:C6:B8:2E:FE:1F:5E:67:17:0D:A4:AE:68:1E:D0:9F:BE:E5"
          ACTUAL_SHA1="$(keytool -list -v -keystore "$KEY" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          echo "Original stable signing cert SHA1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Restored key does not match Google Play upload certificate; refusing to sign."
            exit 1
          fi

      - name: Sign production Android App Bundle
        run: |
          set -euo pipefail
          ORIGINAL="unsigned/DMZ-Ranked-React-Native-Stable-1.1.1-187.aab"
          SIGNED="DMZ-Ranked-React-Native-Stable-1.1.1-187-Signed.aab"
          test -s "$ORIGINAL"
          jarsigner -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -signedjar "$SIGNED" "$ORIGINAL" androiddebugkey
          jarsigner -verify "$SIGNED"
          EXPECTED_SHA1="E2:A5:91:C6:B8:2E:FE:1F:5E:67:17:0D:A4:AE:68:1E:D0:9F:BE:E5"
          SIGNED_SHA1="$(keytool -printcert -jarfile "$SIGNED" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          if [ "$SIGNED_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signed bundle certificate mismatch."
            exit 1
          fi
          unzip -t "$SIGNED" | tail -1
          echo "Signed bundle matches expected Play upload certificate."

      - name: Publish signed non-beta AAB
        uses: actions/upload-artifact@v6
        with:
          name: DMZ-Ranked-React-Native-Stable-1.1.1-187-Signed-AAB
          path: DMZ-Ranked-React-Native-Stable-1.1.1-187-Signed.aab
          if-no-files-found: error
          retention-days: 30
