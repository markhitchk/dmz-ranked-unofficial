name: Refresh compatible app dependencies

on:
  push:
    branches: [react-native-migration]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-refresh-react-native-migration
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    env:
      CI: '1'
      APP_VARIANT: beta
    steps:
      - name: Checkout React Native branch
        uses: actions/checkout@v7
        with:
          ref: react-native-migration

      - name: Install latest Node 24 LTS patch
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true

      - name: Install current JDK 17 patch
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Refresh supported dependencies and npm lockfile
        run: |
          # Refresh third-party packages within their compatible major releases.
          # Expo owns the React / React Native / Expo version matrix.
          npx --yes npm-check-updates@latest -u --target minor --reject 'expo,expo-*,react,react-native'
          npm install --no-audit --no-fund
          npm update --no-audit --no-fund
          npx expo install --fix --npm
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify compatibility and regressions
        run: |
          npm run check:framework
          npx expo install --check
          npx expo-doctor
          npm run typecheck
          npm test

      - name: Propose tested dependency and lockfile updates
        id: propose
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/compatible-dependencies
          base: react-native-migration
          delete-branch: true
          commit-message: 'chore: refresh Expo-compatible dependencies and npm lockfile'
          title: 'chore: update Expo-compatible dependencies and npm lockfile'
          body: |
            Automated dependency update for DMZ Ranked Unofficial React Native.
            Aligns native packages with the installed Expo SDK, refreshes
            resolved transitive versions, and adds/updates package-lock.json.

            The workflow ran Expo compatibility checks, Expo Doctor,
            TypeScript and unit tests. Review native/build behavior before merging.
          add-paths: |
            package.json
            package-lock.json

      - name: Publish compatible dependency manifests for manual review
        if: always() && steps.propose.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: expo-compatible-dependency-proposal
          path: |
            package.json
            package-lock.json
          if-no-files-found: error

      - name: Explain missing PR permissions
        if: steps.propose.outcome == 'failure'
        run: |
          echo "::warning::GitHub Actions may not create pull requests. Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests. Updated manifests are uploaded as an artifact for manual review."
