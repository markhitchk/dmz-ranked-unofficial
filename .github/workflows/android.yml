name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Android only accepts an APK update when the package and signing certificate
# match the installed app. Keep one CI signing key cached and serialize builds
# so the first cache-miss run cannot race another run and create a second key.
concurrency:
  group: dmz-ranked-android-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare stable signing directory
        run: mkdir -p "$HOME/.android"

      - name: Restore stable APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dmz-ranked-apk-signing-v1

      - name: Create signing key on first run
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=DMZ Ranked Unofficial, OU=Android App, O=Harley's Studios, C=US"
          fi

      - name: Build update-compatible APK and Play AAB
        run: gradle assembleDebug bundleRelease

      - name: Show APK signing certificate
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Upload update-compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: DMZ-Ranked-Unofficial-update-compatible
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Verify release AAB signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DMZ-Ranked-1.0.25-127-AAB
          path: app/build/outputs/bundle/release/app-release.aab
