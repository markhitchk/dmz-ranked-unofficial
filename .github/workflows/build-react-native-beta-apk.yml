name: Build React Native Beta APK

on:
  push:
    branches:
      - react-native-migration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-beta-apk:
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install JavaScript dependencies
        run: npm install

      - name: Loading regression tests
        run: npm test

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Verify beta package
        run: |
          grep -R "com.harleytg.dmzranked.beta" android/app/build.gradle android/app/src/main/AndroidManifest.xml || true
          npx expo config --type public | grep -F "com.harleytg.dmzranked.beta"

      - name: Compile native migration bridge
        working-directory: android
        run: ./gradlew :dmz-migration:compileReleaseKotlin --stacktrace

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DMZ-Ranked-React-Native-Beta-1.1.0-186.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: DMZ-Ranked-React-Native-Beta-1.1.0-186
          path: DMZ-Ranked-React-Native-Beta-1.1.0-186.apk
          if-no-files-found: error
          retention-days: 30
