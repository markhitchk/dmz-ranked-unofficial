name: Build React Native Beta APK

on:
  push:
    branches:
      - react-native-migration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-beta-apk:
    runs-on: ubuntu-24.04
    env:
      APP_VARIANT: beta
      CI: '1'
      # RC peer ranges may reject prerelease React Native during npm resolution.
      NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Install JavaScript dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No lockfile yet. Merge the automated dependency-refresh PR for reproducible builds."
            npm install --no-audit --no-fund
          fi

      - name: Align Expo 58 native packages
        run: npx expo install --fix --npm

      - name: Verify latest Expo-compatible dependencies
        run: |
          npx expo install --check
          npx expo-doctor

      - name: Report available dependency upgrades
        run: npm outdated || true

      - name: TypeScript check
        run: npm run typecheck

      - name: Loading regression tests
        run: npm test

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --non-interactive

      - name: Verify beta package and resolve APK filename
        run: |
          set -euo pipefail
          npx expo config --json --type public | node -e '
            const fs = require("node:fs");
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const cfg = JSON.parse(data);
              if (cfg.android?.package !== "com.harleytg.dmzranked.beta" || cfg.extra?.appChannel !== "beta")
                throw Error("Beta package/channel mismatch");
              const code = cfg.android?.versionCode;
              if (!/^[0-9]+(?:\.[0-9]+){2,3}$/.test(String(cfg.version)) || !Number.isInteger(code) || code < 1)
                throw Error("Invalid beta version/build");
              const stem = "DMZ-Ranked-React-Native-Beta-" + cfg.version + "-" + code;
              fs.appendFileSync(process.env.GITHUB_ENV, "BETA_APK_STEM=" + stem + "\n");
              console.log("Verified beta artifact: " + stem);
            });
          '

      - name: Compile native migration bridge
        working-directory: android
        run: ./gradlew :dmz-migration:compileReleaseKotlin --stacktrace

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${BETA_APK_STEM}.apk"

      - name: Upload beta APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BETA_APK_STEM }}
          path: ${{ env.BETA_APK_STEM }}.apk
          if-no-files-found: error
          retention-days: 30
